<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyHub — sua central de estudos</title>
<meta name="description" content="StudyHub: organize matérias, notas, tarefas, links e vídeos em um só lugar.">
<meta name="theme-color" content="#171A24">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<a class="skip-link" href="#main-content">Pular para o conteúdo</a>

<div class="app-shell">

  <!-- SIDEBAR (desktop) -->
  <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
    <div class="sidebar-brand">
      <span class="brand-mark" aria-hidden="true">◆</span>
      <span class="brand-name">StudyHub</span>
    </div>

    <nav class="sidebar-nav" aria-label="Seções">
      <ul>
        <li><button class="nav-item" data-route="dashboard" aria-current="page"><span class="nav-icon" aria-hidden="true">🏠</span><span>Início</span></button></li>
        <li><button class="nav-item" data-route="subjects"><span class="nav-icon" aria-hidden="true">📚</span><span>Estudos</span></button></li>
        <li><button class="nav-item" data-route="notes"><span class="nav-icon" aria-hidden="true">📝</span><span>Notas</span></button></li>
        <li><button class="nav-item" data-route="tasks"><span class="nav-icon" aria-hidden="true">✅</span><span>Tarefas</span></button></li>
        <li><button class="nav-item" data-route="links"><span class="nav-icon" aria-hidden="true">🔗</span><span>Links</span></button></li>
        <li><button class="nav-item" data-route="videos"><span class="nav-icon" aria-hidden="true">🎥</span><span>Vídeos</span></button></li>
        <li><button class="nav-item" data-route="highlights"><span class="nav-icon" aria-hidden="true">⭐</span><span>Destaques</span></button></li>
        <li><button class="nav-item" data-route="agenda"><span class="nav-icon" aria-hidden="true">📅</span><span>Agenda</span></button></li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-item" data-route="settings"><span class="nav-icon" aria-hidden="true">⚙️</span><span>Configurações</span></button>
    </div>
  </aside>

  <!-- MOBILE TOP BAR -->
  <header class="mobile-topbar">
    <button class="icon-btn" id="mobileMenuBtn" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobileDrawer">
      <span aria-hidden="true">☰</span>
    </button>
    <div class="mobile-brand"><span class="brand-mark" aria-hidden="true">◆</span> StudyHub</div>
    <button class="icon-btn" id="mobileThemeBtn" aria-label="Alternar tema"><span aria-hidden="true">🌙</span></button>
  </header>

  <!-- MOBILE DRAWER -->
  <div class="drawer-overlay" id="drawerOverlay" hidden></div>
  <nav class="mobile-drawer" id="mobileDrawer" aria-label="Menu" hidden>
    <ul>
      <li><button class="nav-item" data-route="dashboard"><span class="nav-icon">🏠</span><span>Início</span></button></li>
      <li><button class="nav-item" data-route="subjects"><span class="nav-icon">📚</span><span>Estudos</span></button></li>
      <li><button class="nav-item" data-route="notes"><span class="nav-icon">📝</span><span>Notas</span></button></li>
      <li><button class="nav-item" data-route="tasks"><span class="nav-icon">✅</span><span>Tarefas</span></button></li>
      <li><button class="nav-item" data-route="links"><span class="nav-icon">🔗</span><span>Links</span></button></li>
      <li><button class="nav-item" data-route="videos"><span class="nav-icon">🎥</span><span>Vídeos</span></button></li>
      <li><button class="nav-item" data-route="highlights"><span class="nav-icon">⭐</span><span>Destaques</span></button></li>
      <li><button class="nav-item" data-route="agenda"><span class="nav-icon">📅</span><span>Agenda</span></button></li>
      <li><button class="nav-item" data-route="settings"><span class="nav-icon">⚙️</span><span>Configurações</span></button></li>
    </ul>
  </nav>

  <!-- MAIN -->
  <div class="main-wrap">
    <header class="topbar">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">🔎</span>
        <input type="search" id="globalSearch" placeholder="Pesquisar notas, tarefas, links, vídeos…" aria-label="Pesquisa global">
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggleBtn" aria-label="Alternar tema claro/escuro" title="Alternar tema">
          <span aria-hidden="true" id="themeIcon">🌙</span>
        </button>
        <button class="btn btn-primary" id="quickAddBtn">
          <span aria-hidden="true">＋</span> Novo
        </button>
      </div>
    </header>

    <main id="main-content" class="view-container" tabindex="-1">
      <!-- Views are rendered here by render.js -->
    </main>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

<!-- MODAL ROOT -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" id="modalRoot" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>

<!-- QUICK ADD MENU -->
<div class="quick-add-menu" id="quickAddMenu" hidden>
  <button data-quick="note"><span aria-hidden="true">📝</span> Nova anotação</button>
  <button data-quick="task"><span aria-hidden="true">✅</span> Nova tarefa</button>
  <button data-quick="link"><span aria-hidden="true">🔗</span> Novo link</button>
  <button data-quick="video"><span aria-hidden="true">🎥</span> Novo vídeo</button>
  <button data-quick="subject"><span aria-hidden="true">📚</span> Nova matéria</button>
</div>

<script src="./js/utils.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/render.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
